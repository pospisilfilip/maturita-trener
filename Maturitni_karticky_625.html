    ["Jaký je rozdíl mezi primárními a podpůrnými aktivy?", "Primární = informace/data a procesy (to hlavní). Podpůrná = hardware, software, sítě, personál, lokality (slouží primárním aktivům)."],
    ["Co jsou primární aktiva?", "Informace/data (databáze, dokumenty, osobní údaje, zdrojový kód) a procesy/služby organizace."],
    ["Co jsou podpůrná aktiva?", "Hardware (servery, počítače), software (OS, aplikace), sítě (kabeláž, Wi-Fi), personál (znalosti) a lokality (budovy, serverovny)."],
    ["Podle čeho se určuje hodnota aktiva?", "Podle dopadu jeho narušení na triádu CIA (důvěrnost, integrita, dostupnost), ne jen podle pořizovací ceny."],
    ["Jak se hodnotí důvěrnost aktiva?", "Podle citlivosti informací – jak závažné by bylo jejich vyzrazení neoprávněné osobě."],
    ["Jak se hodnotí dostupnost aktiva?", "Podle toho, jak rychle organizace potřebuje aktivum zpět a jak velký dopad má jeho výpadek (souvisí s RTO)."],
    ["Jak se klasifikují aktiva?", "Podle citlivosti, např.: veřejné, interní, důvěrné, přísně tajné/kritické. Klasifikace určuje míru ochrany."],
    ["Kdo je garant (vlastník) aktiva?", "Osoba odpovědná za ochranu aktiva, jeho klasifikaci a přidělování přístupových oprávnění."],
    ["Co je registr (evidence) aktiv?", "Seznam všech aktiv s jejich hodnotou, garantem a klasifikací. Základ analýzy rizik – nelze chránit to, o čem nevíme."],
    ["Co je CMDB?", "Configuration Management Database – databáze konfiguračních položek (aktiv) a jejich vzájemných vazeb, využívaná ve správě IT a bezpečnosti."],
    ["Proč je evidence aktiv prvním krokem řízení rizik?", "Bez znalosti aktiv nelze určit hrozby, zranitelnosti ani rizika. Neevidované aktivum nelze chránit."],
    ["Co je životní cyklus aktiva?", "Pořízení → provoz a údržba → klasifikace a ochrana → vyřazení (bezpečná likvidace dat). Bezpečnost se řeší v celém cyklu."],
    ["Proč jsou data nejdůležitějším aktivem?", "Protože jsou nenahraditelná a často nejcennější – hardware lze koupit znovu, ztracená nebo unikla data nikoli."],
    ["Je personál aktivem?", "Ano – zaměstnanci a jejich znalosti jsou podpůrné aktivum. Odchod klíčové osoby je riziko (ztráta know-how)."],
    ["Co je bezpečná likvidace dat?", "Trvalé a neobnovitelné odstranění dat při vyřazení aktiva (přepis, fyzické zničení nosiče), aby nedošlo k úniku."],
    ["Jak souvisí klasifikace aktiv s přístupovými právy?", "Čím citlivější klasifikace, tím přísnější řízení přístupu (kdo a za jakých podmínek smí aktivum používat)."],
    ["Co je hodnocení dopadu (impact)?", "Odhad následků narušení aktiva (finanční, reputační, právní, ohrožení provozu nebo životů). Vstupuje do analýzy rizik."],
    ["Jak souvisí aktiva s analýzou rizik?", "Riziko se počítá pro každé aktivum: jeho hodnota × hrozba × zranitelnost. Cennější aktiva vyžadují silnější ochranu."],
    ["Co je inventarizace aktiv?", "Pravidelné ověřování úplnosti a aktuálnosti registru aktiv – aby evidence odpovídala skutečnosti."],
    ["Co je primární aktivum podle nZKB?", "Poskytovaná regulovaná služba nebo informace; na ně navazují podpůrná aktiva (technika, lidé), na něž se vztahují povinnosti zákona."],
    ["Proč nelze hodnotu aktiva určit jen cenou?", "Protože malá levná položka (např. databáze hesel) může mít obrovský dopad při zneužití. Rozhoduje dopad na CIA, ne cena."],
    ["Co je informační aktivum?", "Jakákoli informace, která má pro organizaci hodnotu – databáze, smlouvy, know-how, osobní údaje."],
    ["Co je kritické aktivum?", "Aktivum, jehož narušení by mělo zásadní dopad na fungování organizace (např. hlavní databáze, klíčový server)."],
    ["Jak souvisí aktiva s rozsahem ISMS?", "Rozsah ISMS se určuje právě podle aktiv – která aktiva chráníme, na ta se vztahují bezpečnostní opatření."],
  ]},
  { t: "19. Zranitelnost aktiva", cards: [
    ["Co je zranitelnost?", "Slabé místo aktiva nebo opatření, které může být zneužito hrozbou. Sama o sobě nezpůsobí škodu, ale otevírá cestu útoku."],
    ["Jak souvisí zranitelnost, hrozba a riziko?", "Hrozba využije zranitelnost → vznikne incident → škoda. Riziko = pravděpodobnost, že hrozba zneužije zranitelnost, × dopad."],
    ["Jmenuj kategorie zranitelností.", "Technické (neaktualizovaný SW, chyby v kódu), konfigurační (výchozí hesla), organizační (chybějící politiky), fyzické (nezabezpečená serverovna), lidské (phishing)."],
    ["Co jsou technické zranitelnosti?", "Neaktualizovaný software, chyby v kódu, slabé šifrování, otevřené porty, neopravené chyby aplikací."],
    ["Co jsou konfigurační zranitelnosti?", "Výchozí hesla, špatně nastavená oprávnění, zbytečné běžící služby, nedostatečné nastavení zabezpečení."],
    ["Co jsou lidské zranitelnosti?", "Náchylnost uživatelů k phishingu a sociálnímu inženýrství, slabá hesla, neopatrné chování."],
    ["Co je zero-day zranitelnost?", "Zranitelnost, kterou útočníci zneužívají dříve, než pro ni existuje oprava. Obrana je velmi obtížná."],
    ["Jaký je životní cyklus zranitelnosti?", "Vznik (chyba v kódu) → objevení → zveřejnění (CVE) → vydání záplaty dodavatelem → nasazení záplaty u zákazníka (patch management)."],
    ["Co je CVE?", "Common Vulnerabilities and Exposures – jednotný katalog a identifikátor známých zranitelností."],
    ["Co je CVSS?", "Common Vulnerability Scoring System – skóre závažnosti zranitelnosti 0–10 (Critical, High, Medium, Low)."],
    ["Co je vulnerability scanning?", "Automatické skenování systémů na známé zranitelnosti pomocí nástrojů (Nessus, OpenVAS)."],
    ["Co je patch management?", "Proces pravidelného nasazování aktualizací a záplat, aby se odstranily známé zranitelnosti."],
    ["Co je hardening?", "Zpevnění systému – odstranění zbytečných služeb, změna výchozích nastavení a hesel, omezení oprávnění."],
    ["Co je secure coding?", "Bezpečné programování – psaní kódu odolného vůči zranitelnostem (validace vstupů, ošetření chyb)."],
    ["Jak snižovat zranitelnosti?", "Patch management, hardening, bezpečné programování, pravidelné skeny a penetrační testy, školení uživatelů."],
    ["Co je expozice (exposure)?", "Míra, do jaké je aktivum vystaveno hrozbám (např. server dostupný z internetu má vyšší expozici než interní)."],
    ["Co je attack surface (útočná plocha)?", "Souhrn všech míst, kudy se útočník může pokusit proniknout (porty, služby, vstupy aplikací, uživatelé). Cílem je ji zmenšovat."],
    ["Jaký je rozdíl mezi známou a neznámou zranitelností?", "Známá má přidělené CVE a obvykle i záplatu. Neznámá (zero-day) ještě nebyla zveřejněna ani opravena."],
    ["Co je riziková analýza zranitelností?", "Vyhodnocení nalezených zranitelností podle závažnosti (CVSS) a dopadu, určení priorit oprav."],
    ["Proč jsou výchozí hesla nebezpečná?", "Jsou veřejně známá a útočníci je zkoušejí jako první. Patří mezi nejčastější konfigurační zranitelnosti."],
    ["Co je misconfiguration?", "Chybná konfigurace systému nebo služby (otevřené sdílení, slabá oprávnění), která vytváří zranitelnost."],
    ["Jak souvisí zranitelnosti s aktualizacemi?", "Většina zneužitých zranitelností je známá a má záplatu – včasné aktualizace jsou nejúčinnější obranou."],
    ["Co je penetrační test ve vztahu ke zranitelnostem?", "Aktivní ověření, zda nalezené zranitelnosti lze skutečně zneužít – jde dál než pouhý sken."],
    ["Co je responsible disclosure?", "Zodpovědné zveřejnění – nálezce nahlásí zranitelnost dodavateli a dá mu čas na opravu, než ji zveřejní."],
    ["Co je bug bounty?", "Program, v němž organizace odměňuje nálezce, kteří jí nahlásí zranitelnosti místo jejich zneužití."],
  ]},
  { t: "20. Kybernetické hrozby", cards: [
    ["Co je hrozba?", "Potenciální příčina nežádoucího incidentu, která může poškodit aktivum. Útočník využívá zranitelnosti k naplnění hrozby."],
    ["Jaké jsou zdroje hrozeb?", "Vnější útočníci (hackeři, organizovaný zločin, APT), vnitřní hrozby (nespokojení/neopatrní zaměstnanci) a náhodné/přírodní (selhání HW, požár, povodeň)."],
    ["Co je malware?", "Škodlivý software navržený k poškození, narušení nebo neoprávněnému přístupu k systému."],
    ["Jaký je rozdíl mezi virem a červem?", "Virus se šíří připojením k souboru a potřebuje hostitele. Červ (worm) se šíří samostatně po síti bez zásahu uživatele."],
    ["Co je trojský kůň?", "Malware, který se tváří jako legitimní program, ale skrytě provádí škodlivou činnost."],
    ["Co je ransomware?", "Malware, který zašifruje data a žádá výkupné za jejich odemčení. Obrana: zálohy (3-2-1), aktualizace, školení."],
    ["Co je spyware a keylogger?", "Spyware špehuje uživatele a krade údaje. Keylogger zaznamenává stisky kláves (např. hesla)."],
    ["Co je rootkit?", "Malware, který skrývá přítomnost útočníka a jeho aktivity v systému, často s nejvyššími oprávněními."],
    ["Co je botnet?", "Síť napadených zařízení („zombie“) ovládaná útočníkem na dálku, často používaná pro DDoS útoky nebo rozesílání spamu."],
    ["Co je phishing?", "Podvodné e-maily nebo zprávy lákající přihlašovací údaje nebo k otevření škodlivé přílohy/odkazu."],
    ["Jaké jsou varianty phishingu?", "Spear phishing (cílený na osobu), whaling (na vedení), vishing (telefon), smishing (SMS)."],
    ["Co je sociální inženýrství?", "Manipulace lidí, aby vyzradili informace nebo provedli akci. Patří sem phishing, pretexting (záminka), baiting (návnada, např. USB)."],
    ["Co je DoS a DDoS útok?", "Denial of Service – zahlcení služby požadavky → nedostupnost. DDoS = distribuovaný, z mnoha zařízení (botnet) najednou."],
    ["Co je Man-in-the-Middle (MitM)?", "Útok, při kterém se útočník vloží do komunikace a odposlouchává nebo mění přenášená data."],
    ["Co je SQL injection?", "Vložení škodlivého SQL kódu do vstupu aplikace, které umožní neoprávněný přístup k databázi."],
    ["Co je XSS (Cross-Site Scripting)?", "Vložení škodlivého skriptu do webové stránky, který se spustí v prohlížeči jiných uživatelů."],
    ["Co je brute force útok?", "Hádání hesla nebo klíče hrubou silou – systematické zkoušení všech možných kombinací."],
    ["Co je APT?", "Advanced Persistent Threat – sofistikovaný, dlouhodobý a cílený útok (často státem podporovaný), který zůstává dlouho skrytý."],
    ["Co je insider threat (vnitřní hrozba)?", "Hrozba ze strany osoby uvnitř organizace (zaměstnanec, dodavatel) – úmyslná (zlý úmysl) nebo neúmyslná (chyba, nedbalost)."],
    ["Co je zero-day útok?", "Útok zneužívající zranitelnost, pro kterou ještě neexistuje oprava. Obrana je velmi obtížná."],
    ["Co je supply chain útok?", "Útok přes dodavatele nebo software třetí strany – útočník kompromituje důvěryhodný zdroj, aby zasáhl jeho zákazníky."],
    ["Co je credential stuffing?", "Zneužití uniklých dvojic jméno/heslo k automatizovanému přihlašování do dalších služeb (lidé opakují hesla)."],
    ["Co je drive-by download?", "Stažení malwaru do zařízení pouhým navštívením kompromitované webové stránky, bez vědomého souhlasu uživatele."],
    ["Proč je člověk nejčastější vstupní branou útoku?", "Protože sociální inženýrství obchází technická opatření přes lidskou důvěřivost. Proto je školení uživatelů klíčové."],
    ["Co je phishingová simulace?", "Cvičný phishing rozeslaný vlastním zaměstnancům k otestování a zvýšení jejich ostražitosti."],
  ]},
  { t: "21. Bezpečnostní opatření", cards: [
    ["Co jsou bezpečnostní opatření (controls)?", "Prostředky ke snížení rizika – brání vzniku incidentu, omezují jeho dopad nebo umožní detekci a obnovu."],
    ["Jak dělíme opatření podle typu?", "Organizační (politiky, školení), technická (firewall, šifrování), fyzická (zámky, kamery), personální (prověrky, NDA, osvěta)."],
    ["Jak dělíme opatření podle funkce?", "Preventivní (zabraňují – firewall), detekční (odhalí – IDS, logy), reaktivní/nápravná (obnoví – zálohy, plán obnovy)."],
    ["Co jsou organizační opatření?", "Politiky, směrnice, procesy, role a školení – netechnická opatření řídící chování a odpovědnosti."],
    ["Co jsou technická opatření?", "Technologické prvky ochrany: firewall, antivir, šifrování, IDS/IPS, MFA, segmentace sítě."],
    ["Co jsou fyzická opatření?", "Ochrana prostor a hardwaru: zámky, kamery, čipové karty, zabezpečené serverovny, ostraha."],
    ["Co je firewall?", "Zařízení/software filtrující síťový provoz podle pravidel – propouští povolený a blokuje nežádoucí. Preventivní opatření."],
    ["Co je IDS a IPS?", "IDS (Intrusion Detection System) detekuje průniky. IPS (Intrusion Prevention System) je i aktivně blokuje."],
    ["Co je antivirus a EDR?", "Antivirus chrání před známým malwarem. EDR (Endpoint Detection and Response) navíc průběžně sleduje a reaguje na podezřelé chování koncových stanic."],
    ["Co je šifrování a kde se používá?", "Převod dat do nečitelné podoby. Chrání data v klidu (šifrování disku) i při přenosu (TLS, VPN). Zajišťuje důvěrnost."],
    ["Co je VPN?", "Virtual Private Network – šifrovaný tunel pro bezpečný přenos dat přes nedůvěryhodnou síť (např. internet)."],
    ["Co je MFA?", "Vícefaktorové ověření. Faktory: něco vím (heslo), něco mám (token, telefon), něco jsem (biometrie)."],
    ["Co je segmentace sítě?", "Rozdělení sítě na oddělené části (VLAN, DMZ), aby se útok nešířil a aby se oddělily systémy s různou citlivostí."],
    ["Co je DMZ?", "Demilitarizovaná zóna – oddělená síťová oblast mezi vnitřní sítí a internetem, kam se umísťují veřejně dostupné služby (web, mail)."],
    ["Jaký je rozdíl mezi autentizací a autorizací?", "Autentizace = ověření identity (kdo jsi). Autorizace = přidělení oprávnění (co smíš dělat)."],
    ["Co je princip nejmenších oprávnění?", "Least privilege – uživatel/proces má jen ta oprávnění, která nezbytně potřebuje. Omezuje dopad zneužití účtu."],
    ["Co je RBAC?", "Role-Based Access Control – řízení přístupu podle rolí místo jednotlivců. Usnadňuje správu oprávnění."],
    ["Co je defense in depth?", "Vrstvená obrana – více nezávislých vrstev ochrany (fyzická, síťová, aplikační, datová), aby selhání jedné neznamenalo prolomení celku."],
    ["Co je zálohování a pravidlo 3-2-1?", "Pořizování kopií dat pro obnovu. Pravidlo 3-2-1: 3 kopie, 2 různá média, 1 mimo lokalitu (off-site)."],
    ["Co je logování a monitoring?", "Zaznamenávání událostí v systémech a jejich průběžné sledování – detekční opatření umožňující odhalit incidenty."],
    ["Co je SIEM?", "Security Information and Event Management – systém sbírající a analyzující logy z mnoha zdrojů pro detekci hrozeb."],
    ["Co je honeypot?", "Záměrně zranitelný „návnadový“ systém, který láká útočníky, aby bylo možné je odhalit a studovat jejich postup."],
    ["Co je zálohovací strategie a obnova?", "Plán, jak a jak často zálohovat a jak data obnovit. Zálohy je nutné pravidelně testovat (jinak nemusí fungovat)."],
    ["Co je antivirová a antispamová ochrana e-mailu?", "Filtrování příchozí pošty na malware a podvodné zprávy – významně snižuje úspěšnost phishingu."],
    ["Proč je důležitá kombinace opatření (prevence–detekce–reakce)?", "Žádné opatření není stoprocentní; kombinace prevence, detekce a reakce zajistí, že útok je buď zastaven, nebo včas odhalen a zvládnut."],
  ]},
{ t: "22. BCDR a krizové řízení", cards: [
    ["Co znamená BCDR?", "Business Continuity (kontinuita činností) + Disaster Recovery (obnova po havárii). Cíl: přežít incident a co nejrychleji obnovit provoz."],
    ["Co je BCM (Business Continuity Management)?", "Řízení kontinuity činností – udržení klíčových procesů i během krize a jejich plánovaná obnova."],
    ["Jaký je rozdíl mezi BCP a DRP?", "BCP (Business Continuity Plan) = jak udržet fungování organizace během krize. DRP (Disaster Recovery Plan) = jak obnovit IT systémy po havárii."],
    ["Co je BIA?", "Business Impact Analysis – analýza dopadů: které procesy jsou kritické a jaký dopad má jejich výpadek. Určuje priority obnovy."],
    ["Co je RTO?", "Recovery Time Objective – za jak dlouho musí být služba obnovena (maximální přijatelná doba výpadku)."],
    ["Co je RPO?", "Recovery Point Objective – kolik dat si můžeme dovolit ztratit, tedy jak staré zálohy postačují (jak často zálohovat)."],
    ["Uveď příklad RTO a RPO.", "RPO 1 hodina = zálohujeme alespoň každou hodinu. RTO 4 hodiny = systém musí běžet do 4 hodin od výpadku."],
    ["Jaký je rozdíl mezi RTO a RPO?", "RTO = ČAS obnovy (jak dlouho výpadek). RPO = množství ztracených DAT (jak staré zálohy). Časté zaměnění u zkoušky."],
    ["Co je pravidlo zálohování 3-2-1?", "3 kopie dat, na 2 různých médiích, 1 kopie mimo lokalitu (off-site)."],
    ["Jaké jsou typy záložních lokalit?", "Hot site (okamžitě připravená, drahá), warm site (částečně připravená) a cold site (jen prostor bez vybavení, levná)."],
    ["Co je redundance?", "Zdvojení klíčových prvků, aby výpadek jednoho neohrozil provoz – např. RAID (disky), clustery (servery), záložní napájení (UPS, diesel)."],
    ["Co je RAID?", "Redundant Array of Independent Disks – zapojení více disků pro zvýšení spolehlivosti (data přežijí výpadek disku) nebo výkonu."],
    ["Co je UPS?", "Uninterruptible Power Supply – záložní zdroj napájení, který překlene krátký výpadek proudu a umožní bezpečné vypnutí nebo přepnutí na generátor."],
    ["Jaké jsou fáze krizového řízení?", "Prevence a příprava (plány, cvičení), detekce a vyhlášení krize, reakce (krizový tým), obnova provozu a poučení (lessons learned)."],
    ["Co je krizový tým?", "Skupina odpovědná za řízení organizace během krize – aktivuje plány, koordinuje reakci a komunikaci."],
    ["Jaké jsou fáze zvládání incidentu?", "Detekce → analýza → zadržení (containment) → odstranění (eradikace) → obnova → poučení (lessons learned)."],
    ["Co je containment (zadržení)?", "Omezení šíření incidentu – izolace napadeného systému, aby se útok nešířil dál."],
    ["Co je eradikace?", "Odstranění příčiny incidentu ze systému (malware, kompromitovaný účet, zranitelnost) před obnovou provozu."],
    ["Proč je důležité testování plánů obnovy?", "Netestovaný plán nebo záloha nemusí v krizi fungovat. Pravidelná cvičení ověří funkčnost a připravenost lidí."],
    ["Co je lessons learned?", "Vyhodnocení incidentu po jeho zvládnutí – co selhalo a jak se zlepšit, aby se neopakoval (uzavírá cyklus)."],
    ["Jak souvisí hlášení incidentů s krizovým řízením?", "Závažné incidenty se hlásí NÚKIBu/Národnímu CERT v zákonných lhůtách (24/72 h dle režimu) a vedou se o nich záznamy a důkazy."],
    ["Co je kontinuita dodavatelského řetězce?", "Zajištění, že výpadek dodavatele neohrozí činnost organizace – zálohní dodavatelé, smluvní záruky dostupnosti."],
    ["Co je krizová komunikace?", "Plánovaná komunikace s veřejností, zákazníky a úřady během krize – jasná, včasná a koordinovaná, aby se omezila panika a reputační škoda."],
    ["Jaký je vztah BCDR a řízení rizik?", "Řízení rizik identifikuje hrozby; BCDR připravuje organizaci na situaci, kdy se riziko naplní (zajištění kontinuity a obnovy)."],
    ["Proč je off-site záloha důležitá?", "Aby přežila i lokální katastrofu (požár, povodeň, ransomware šifrující i lokální zálohy). Záloha v téže budově nestačí."],
  ]},
  { t: "23. Penetrační testy", cards: [
    ["Co je penetrační test?", "Řízený a autorizovaný simulovaný útok na systém s cílem najít a ověřit zranitelnosti dříve, než je zneužije skutečný útočník."],
    ["Jaký je rozdíl mezi pentestem a vulnerability scanem?", "Scan je automatický a hledá známé zranitelnosti (povrchní, široký). Pentest kombinuje nástroje a manuální práci a ověří, zda zranitelnosti lze skutečně zneužít (hluboký)."],
    ["Co je black box test?", "Tester nemá žádné informace o systému – simuluje externího útočníka."],
    ["Co je white box test?", "Tester má plné informace (zdrojový kód, schémata, přístupy) – nejdůkladnější analýza."],
    ["Co je grey box test?", "Tester má částečné informace (např. běžný uživatelský účet) – kompromis mezi black a white box."],
    ["Jaké jsou fáze penetračního testu?", "1) Plánování a dohoda (scope, povolení), 2) sběr informací (reconnaissance), 3) skenování a mapování, 4) získání přístupu (exploitation), 5) postexploitace, 6) reportování."],
    ["Co je reconnaissance (sběr informací)?", "Průzkum cíle – pasivní (veřejné zdroje, OSINT) i aktivní (skenování). Cílem je shromáždit co nejvíce informací o cíli."],
    ["Co je exploitation (získání přístupu)?", "Skutečné zneužití nalezené zranitelnosti k získání přístupu do systému."],
    ["Co je postexploitace?", "Činnost po průniku – eskalace oprávnění, pohyb po síti (lateral movement), získání dalších dat. Ukazuje reálný dopad."],
    ["Co obsahuje report z pentestu?", "Nalezené zranitelnosti, jejich závažnost, způsob zneužití (důkaz) a konkrétní doporučení k nápravě."],
    ["Za jakých podmínek je pentest legální?", "Pouze s písemným souhlasem (povolením) vlastníka systému a vymezeným rozsahem. Bez souhlasu jde o trestný čin (§ 230 TZ)."],
    ["Co je scope (rozsah) pentestu?", "Přesné vymezení, které systémy, adresy a techniky jsou povolené. Chrání obě strany a definuje hranice testu."],
    ["Jmenuj nástroje pro pentest.", "Nmap (skenování sítě), Metasploit (exploity), Burp Suite (web), Wireshark (analýza provozu), John the Ripper (lámání hesel)."],
    ["Co je Kali Linux?", "Linuxová distribuce vybavená nástroji pro penetrační testování a bezpečnostní analýzu."],
    ["Co je Nmap?", "Nástroj pro skenování sítě – mapuje hosty, otevřené porty a běžící služby."],
    ["Co je Metasploit?", "Framework pro vývoj a spouštění exploitů – ověření zneužitelnosti zranitelností."],
    ["Co je OWASP Top 10?", "Seznam nejčastějších a nejzávažnějších zranitelností webových aplikací (injection, broken access control, XSS aj.)."],
    ["Jaké jsou metodiky pentestu?", "OWASP (web), PTES (Penetration Testing Execution Standard), OSSTMM."],
    ["Jaký je rozdíl mezi white hat a black hat hackerem?", "White hat = etický hacker pracující legálně. Black hat = útočník jednající nelegálně se zlým úmyslem. Grey hat se pohybuje na hraně."],
    ["Co je etický hacking?", "Legální testování bezpečnosti s povolením vlastníka, jehož cílem je najít a opravit slabiny dříve než útočník."],
    ["Co je bug bounty?", "Program, v němž organizace odměňuje nálezce za nahlášení zranitelností místo jejich zneužití."],
    ["Co je red team a blue team?", "Red team = útočící tým (simuluje reálný útok). Blue team = obranný tým (detekuje a brání). Purple team kombinuje obojí."],
    ["Co je social engineering test?", "Součást pentestu testující lidi – např. simulovaný phishing nebo pokus o fyzický vstup, k ověření bezpečnostního povědomí."],
    ["Jak často se mají pentesty provádět?", "Pravidelně (např. ročně) a vždy po významné změně systému. U regulovaných subjektů to může vyžadovat zákon/norma."],
    ["Proč pentest nestačí provést jednou?", "Protože systémy a hrozby se neustále mění – nové zranitelnosti a změny v infrastruktuře vyžadují opakované testování."],
  ]},
  { t: "24. Oborová KB", cards: [
    ["Co je oborová (sektorová) kybernetická bezpečnost?", "Přístup ke KB zohledňující specifické hrozby, předpisy a požadavky jednotlivých odvětví. Každý sektor má jiná kritická aktiva a dopady."],
    ["Proč se KB liší podle oborů?", "Liší se kritická aktiva (data pacientů × peníze × energetická síť), regulace a dopady incidentů (ohrožení života × finanční ztráta × výpadek služby)."],
    ["Jaká jsou specifika KB ve zdravotnictví?", "Citlivá data pacientů (zvláštní kategorie GDPR), zdravotnické přístroje a systémy. Ransomware může přímo ohrozit životy."],
    ["Jaká jsou specifika KB v bankovnictví a financích?", "Ochrana peněz a transakcí, podvody a phishing. Regulace DORA, dohled ČNB, směrnice PSD2."],
    ["Co je DORA?", "Nařízení EU o digitální provozní odolnosti finančního sektoru – požadavky na odolnost bank a institucí vůči ICT rizikům a incidentům."],
    ["Jaká jsou specifika KB v energetice?", "Ochrana rozvodných sítí a řídicích systémů (SCADA/ICS). Výpadek ohrožuje dodávky energie celé společnosti. Patří do kritické infrastruktury."],
    ["Jaká jsou specifika KB ve veřejné správě?", "Ochrana osobních údajů občanů a registrů. Spadá pod nZKB (významné systémy) a zákon o elektronických úkonech."],
    ["Jaká jsou specifika KB v dopravě?", "Ochrana řídicích a signalizačních systémů. Výpadek ohrožuje bezpečnost provozu. Regulováno NIS2/nZKB."],
    ["Jaká jsou specifika KB v telekomunikacích?", "Zajištění dostupnosti sítí a spojení. Dohled ČTÚ, regulace NIS2. Výpadek zasáhne mnoho dalších služeb."],
    ["Co je kritická informační infrastruktura (KII/KI)?", "Nejdůležitější systémy a sítě státu, jejichž narušení by mělo závažný dopad na bezpečnost, ekonomiku nebo fungování společnosti."],
    ["Která odvětví patří do kritické infrastruktury?", "Energetika, vodárenství, zdravotnictví, doprava, finance, komunikace, veřejná správa a další (celkem 15 resp. 22 odvětví dle nZKB)."],
    ["Jaké povinnosti mají subjekty kritické infrastruktury?", "Nejpřísnější povinnosti – řízení rizik, audity, bezpečnost dodavatelského řetězce, hlášení incidentů, zajištění dostupnosti služby."],
    ["Jak NIS2 mění okruh regulovaných subjektů?", "Výrazně ho rozšiřuje. Zavádí kategorie „základní“ (essential) a „důležité“ (important) subjekty s odstupňovanými povinnostmi a odpovědností vedení."],
    ["Co je strategicky významná služba?", "Zvláštní kategorie regulovaných služeb dle nZKB, jejichž narušení může ohrozit bezpečnost státu nebo veřejný pořádek; určuje je nařízení vlády."],
    ["Proč mají kritická odvětví přísnější regulaci?", "Protože dopad jejich narušení je nejzávažnější – může ohrozit ekonomiku, základní potřeby obyvatel i lidské životy."],
    ["Co je PSD2?", "Evropská směrnice o platebních službách – mj. zavádí silné ověření klienta (SCA) a otevřené bankovnictví, zvyšuje bezpečnost plateb."],
    ["Jak souvisí bezpečnost dodavatelského řetězce s oborovou KB?", "Útok přes dodavatele může zasáhnout celé odvětví. Regulované subjekty musí prověřovat a evidovat významné dodavatele (nZKB)."],
    ["Co je sektorový CERT/CSIRT?", "Tým pro řešení incidentů zaměřený na konkrétní odvětví (např. finanční sektor), který sdílí hrozby a koordinuje obranu v rámci oboru."],

/* === LOGIKA === */
const state = {
  topic: -1,          // -1 = všechna témata
  order: 'seq',       // seq | shuffle
  filter: 'all',      // all | todo
  idx: 0,
  flipped: false,
  list: [],           // aktuální seznam karet [{topic, q, a, key}]
  progress: {},       // key -> 'know' | 'dunno'
};

// vytvoř ploché ID pro každou kartu
const ALL = [];
DECK.forEach((grp, gi) => {
  grp.cards.forEach((c, ci) => {
    ALL.push({ topic: grp.t, gi, q: c[0], a: c[1], key: gi + '-' + ci });
  });
});

// naplň select
const sel = document.getElementById('topicSel');
let opt = document.createElement('option');
opt.value = -1; opt.textContent = 'Všechny okruhy (' + ALL.length + ' karet)';
sel.appendChild(opt);
DECK.forEach((g, i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = g.t + '  (' + g.cards.length + ')';
  sel.appendChild(o);
});

function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function buildList(){
  let pool = state.topic === -1 ? ALL.slice() : ALL.filter(c => c.gi === state.topic);
  if(state.filter === 'todo'){
    pool = pool.filter(c => state.progress[c.key] !== 'know');
  }
  if(state.order === 'shuffle') shuffle(pool);
  state.list = pool;
  state.idx = 0;
  state.flipped = false;
  render();
}

function render(){
  const flip = document.getElementById('flip');
  if(state.list.length === 0){
    document.getElementById('qText').textContent = 'Žádné karty k zobrazení 🎉';
    document.getElementById('aText').textContent = 'Zkus změnit filtr nebo okruh.';
    document.getElementById('fTopic').textContent = '';
    document.getElementById('bTopic').textContent = '';
    document.getElementById('counter').textContent = '0 / 0';
    flip.classList.remove('flipped');
    updateStats(); updateRate();
    return;
  }
  if(state.idx >= state.list.length) state.idx = state.list.length - 1;
  const card = state.list[state.idx];
  document.getElementById('qText').textContent = card.q;
  document.getElementById('aText').textContent = card.a;
  document.getElementById('fTopic').textContent = card.topic;
  document.getElementById('bTopic').textContent = card.topic;
  document.getElementById('counter').textContent = (state.idx+1) + ' / ' + state.list.length;
  flip.classList.toggle('flipped', state.flipped);
  updateStats(); updateRate();
}

function updateStats(){
  let know=0, dunno=0;
  // počítáme v rámci aktuálního poolu tématu (bez filtru todo) – referenční je výběr okruhu
  const ref = state.topic === -1 ? ALL : ALL.filter(c => c.gi === state.topic);
  ref.forEach(c => {
    if(state.progress[c.key]==='know') know++;
    else if(state.progress[c.key]==='dunno') dunno++;
  });
  const total = ref.length;
  const newc = total - know - dunno;
  document.getElementById('cntKnow').textContent = know;
  document.getElementById('cntDunno').textContent = dunno;
  document.getElementById('cntNew').textContent = newc;
  document.getElementById('barFill').style.width = total ? (know/total*100)+'%' : '0%';
}

function updateRate(){
  const k = document.getElementById('rateKnow');
  const d = document.getElementById('rateDunno');
  k.classList.remove('on'); d.classList.remove('on');
  if(state.list.length===0) return;
  const card = state.list[state.idx];
  const p = state.progress[card.key];
  if(p==='know') k.classList.add('on');
  if(p==='dunno') d.classList.add('on');
}

function flipCard(){ state.flipped = !state.flipped; document.getElementById('flip').classList.toggle('flipped', state.flipped); }
function next(){ if(state.idx < state.list.length-1){ state.idx++; state.flipped=false; render(); } }
function prev(){ if(state.idx > 0){ state.idx--; state.flipped=false; render(); } }
function rate(val){
  if(state.list.length===0) return;
  const card = state.list[state.idx];
  // přepnutí: druhý klik na stejné hodnocení ho zruší
  state.progress[card.key] = (state.progress[card.key]===val) ? undefined : val;
  if(state.progress[card.key]===undefined) delete state.progress[card.key];
  updateRate(); updateStats();
  // po ohodnocení automaticky další (jen když nastaveno)
  if(state.progress[card.key]){ setTimeout(next, 180); }
}

/* === Eventy === */
document.getElementById('flip').addEventListener('click', flipCard);
document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);
document.getElementById('rateKnow').addEventListener('click', e=>{e.stopPropagation(); rate('know');});
document.getElementById('rateDunno').addEventListener('click', e=>{e.stopPropagation(); rate('dunno');});

sel.addEventListener('change', e=>{ state.topic = parseInt(e.target.value,10); buildList(); });

document.getElementById('orderSeq').addEventListener('click', ()=>{ state.order='seq'; setActive('orderSeq','orderShuf'); buildList(); });
document.getElementById('orderShuf').addEventListener('click', ()=>{ state.order='shuffle'; setActive('orderShuf','orderSeq'); buildList(); });

document.getElementById('filterAll').addEventListener('click', ()=>{ state.filter='all'; setActive('filterAll','filterTodo'); buildList(); });
document.getElementById('filterTodo').addEventListener('click', ()=>{ state.filter='todo'; setActive('filterTodo','filterAll'); buildList(); });

document.getElementById('resetProg').addEventListener('click', ()=>{
  if(confirm('Opravdu vynulovat veškerý pokrok (umím/neumím)?')){ state.progress={}; render(); }
});

function setActive(onId, ...offIds){
  document.getElementById(onId).classList.add('active');
  offIds.forEach(id=>document.getElementById(id).classList.remove('active'));
}

document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'){ next(); }
  else if(e.key==='ArrowLeft'){ prev(); }
  else if(e.key===' '){ e.preventDefault(); flipCard(); }
  else if(e.key==='1'){ rate('dunno'); }
  else if(e.key==='2'){ rate('know'); }
});

// init – filtrační tlačítka mají výchozí "Vše" aktivní
document.getElementById('filterAll').classList.add('active');
buildList();
</script>
